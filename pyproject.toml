[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "e2h"
version = "0.25.0"
description = "Evidence-to-Harness: reproducible task capsules and deterministic replay for AI harness improvement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "E2H contributors" }]
dependencies = [
  "a2a-sdk[http-server]>=1.1.2,<2",
  "duckdb>=1.4,<2",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "pytz>=2024,<2027",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
e2h = "e2h.main_cli:app"
e2h-a2a = "e2h.a2a_agent:main"
e2h-genome = "e2h.genome_cli:genome_app"
e2h-mcp = "e2h.mcp_server:main"
e2h-optimizer = "e2h.optimizer_cli:optimizer_app"
e2h-partition = "e2h.partition_cli:partition_app"
e2h-promotion = "e2h.promotion_cli:promotion_app"
e2h-variant = "e2h.variant_cli:variant_app"

[tool.hatch.build.targets.wheel]
packages = ["src/e2h"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=e2h --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["e2h"]

[tool.coverage.run]
omit = ["src/e2h/__main__.py"]
