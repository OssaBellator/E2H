name: Review hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'agent/reproducible-benchmark-environments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/reproducible-benchmark-environments
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Execute embedded review patch
        run: |
          uv run python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          text = Path('.github/workflows/refresh-benchmark-environments.yml').read_text(
              encoding='utf-8'
          )
          section = text.split('      - name: Apply review hardening\n', 1)[1]
          block = section.split('      - run: uv run ruff check . --fix\n', 1)[0]
          prefix = "          uv run python - <<'PY'\n"
          source = block.split(prefix, 1)[1].rsplit('\n          PY\n', 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source.splitlines()
          )
          subprocess.run([sys.executable, '-'], input=normalized, text=True, check=True)
          PY
      - name: Finalize review corrections
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected one replacement in {path}: {old[:60]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/e2h/long_horizon.py')
          text = path.read_text(encoding='utf-8')
          old = '''        for probe in self.probes:\n            if probe.id in probe_ids:\n                raise ValueError("probe ids must be unique")\n            turn_index = turn_ids.get(probe.after_turn_id)\n            if turn_index is None:\n                raise ValueError("probe after_turn_id must reference a task turn")\n            if turn_index < previous_turn_index:\n                raise ValueError("probes must be ordered by their referenced turn")\n            probe_ids.add(probe.id)\n            previous_turn_index = turn_index\n'''
          new = '''        for probe in self.probes:\n            if probe.id in probe_ids:\n                raise ValueError("probe ids must be unique")\n            probe_turn_index = turn_ids.get(probe.after_turn_id)\n            if probe_turn_index is None:\n                raise ValueError("probe after_turn_id must reference a task turn")\n            if probe_turn_index < previous_turn_index:\n                raise ValueError("probes must be ordered by their referenced turn")\n            probe_ids.add(probe.id)\n            previous_turn_index = probe_turn_index\n'''
          if old not in text:
              raise SystemExit('long-horizon probe typing block not found')
          text = text.replace(old, new, 1)
          text = text.replace('noun="long-horizon predictions"', 'noun="prediction"', 1)
          path.write_text(text, encoding='utf-8')

          replace_once(
              'src/e2h/long_horizon_cli.py',
              '''    models = {\n        LongHorizonSchemaKind.CORPUS: LongHorizonCorpus,\n        LongHorizonSchemaKind.PUBLIC: PublicLongHorizonCorpus,\n        LongHorizonSchemaKind.PREDICTIONS: LongHorizonPredictionDocument,\n        LongHorizonSchemaKind.REPORT: LongHorizonEvaluationReport,\n    }\n    rendered = json.dumps(models[kind].model_json_schema(), indent=2, sort_keys=True) + "\\n"\n''',
              '''    if kind is LongHorizonSchemaKind.CORPUS:\n        schema = LongHorizonCorpus.model_json_schema()\n    elif kind is LongHorizonSchemaKind.PUBLIC:\n        schema = PublicLongHorizonCorpus.model_json_schema()\n    elif kind is LongHorizonSchemaKind.PREDICTIONS:\n        schema = LongHorizonPredictionDocument.model_json_schema()\n    else:\n        schema = LongHorizonEvaluationReport.model_json_schema()\n    rendered = json.dumps(schema, indent=2, sort_keys=True) + "\\n"\n''',
          )

          replace_once(
              'tests/test_long_horizon.py',
              '''    task = _simple_task()\n    mutated = task.model_copy(\n        update={"probes": [LongHorizonProbe(id="p2", after_turn_id="missing")]}\n    )\n    corpus = LongHorizonCorpus(id="mutated", title="Mutated", tasks=[mutated])\n    with pytest.raises(LongHorizonError, match="after_turn_id"):\n        export_public_long_horizon_corpus(corpus)\n''',
              '''    corpus = LongHorizonCorpus(id="mutated", title="Mutated", tasks=[_simple_task()])\n    corpus.tasks[0] = corpus.tasks[0].model_copy(\n        update={"probes": [LongHorizonProbe(id="p2", after_turn_id="missing")]}\n    )\n    with pytest.raises(LongHorizonError, match="after_turn_id"):\n        export_public_long_horizon_corpus(corpus)\n''',
          )

          path = Path('tests/test_benchmark_env.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    (environment / "src" / "task.py").write_text(\n')
          end = text.index('    result = _run_checker(environment)\n', start)
          replacement = r'''    (environment / "src" / "task.py").write_text(
        "import re\n"
        "\n"
        "def normalize_identifier(value: str) -> str:\n"
        "    result = re.sub(r'[\\s_-]+', '-', value.strip()).strip('-').lower()\n"
        "    if not result:\n"
        "        raise ValueError('normalized identifier is empty')\n"
        "    return result\n",
        encoding="utf-8",
    )
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - run: uv run ruff check . --fix
      - run: uv run ruff format .
      - run: uv lock
      - name: Generate environment content lock
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from e2h.benchmark_env import load_benchmark_environment_suite, seal_benchmark_environment_suite

          suite = load_benchmark_environment_suite(Path('benchmarks/environments/suite.json'))
          lock = seal_benchmark_environment_suite(suite, root=Path('.'))
          Path('benchmarks/environments/suite.lock.json').write_text(
              lock.model_dump_json(indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Remove one-use review machinery
        run: |
          rm -f .github/workflows/review-hardening.yml
          rm -f .github/workflows/refresh-benchmark-environments.yml
          rm -f .github/workflows/refresh-long-horizon-lock.yml
      - name: Commit reviewed head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden benchmark integrations after review"
          git push origin HEAD:agent/reproducible-benchmark-environments
