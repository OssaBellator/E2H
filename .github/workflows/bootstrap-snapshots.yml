name: Bootstrap workspace snapshots

on:
  push:
    branches: [agent/workspace-snapshots]
    paths: [.bootstrap/snapshots-ready]
  pull_request:
    branches: [agent/oracle-templates]
    paths:
      - .bootstrap/snapshots-ready
      - .github/workflows/bootstrap-snapshots.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/workspace-snapshots
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply fail-closed integration patch
        run: python bootstrap_snapshots.py
      - name: Format and validate
        run: |
          uv sync --extra dev
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run e2h ingest transcript examples/ingest/transcript.json --output .e2h/snapshot-bundle.json
          uv run e2h snapshot create examples .e2h/examples.e2hsnap --include compile --include ingest
          uv run e2h snapshot verify .e2h/examples.e2hsnap
          uv run e2h snapshot inspect .e2h/examples.e2hsnap --json > .e2h/snapshot-manifest.json
          uv run e2h snapshot reference .e2h/examples.e2hsnap --locator cas://ci/examples > .e2h/snapshot-reference.json
          uv run e2h snapshot restore .e2h/examples.e2hsnap .e2h/restored-examples
          test -f .e2h/restored-examples/compile/spec.yaml
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          spec = yaml.safe_load(Path("examples/compile/oracles.yaml").read_text(encoding="utf-8"))
          reference = json.loads(Path(".e2h/snapshot-reference.json").read_text(encoding="utf-8"))
          spec["snapshots"] = [reference]
          Path(".e2h/snapshot-spec.json").write_text(
              json.dumps(spec, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          uv run e2h compile proposal .e2h/snapshot-bundle.json .e2h/snapshot-spec.json --output .e2h/snapshot-proposal.json
          uv run e2h compile verify .e2h/snapshot-proposal.json --workspace . --output .e2h/snapshot-verification.json --require-strong
          uv run e2h compile review .e2h/snapshot-proposal.json --reviewer bootstrap --decision approve --output .e2h/snapshot-approved.json
          uv run e2h compile materialize .e2h/snapshot-approved.json .e2h/snapshot-verification.json --output .e2h/snapshot-capsule.yaml
          uv run e2h run .e2h/snapshot-capsule.yaml --workspace . --output .e2h/snapshot-run.json
      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .bootstrap/snapshots-ready
          rm -rf .e2h
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add deterministic workspace snapshots"
          git push origin HEAD:agent/workspace-snapshots
