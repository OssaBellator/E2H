name: Bootstrap OpenAI Responses ingest

on:
  push:
    branches: [agent/openai-responses-ingest]
    paths: [.bootstrap/openai-responses-ready]
  pull_request:
    branches: [agent/experiment-store]
    paths:
      - .bootstrap/openai-responses-ready
      - .github/workflows/bootstrap-openai-responses.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/openai-responses-ingest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply fail-closed integration patch
        run: |
          python fix_openai_bootstrap.py
          python bootstrap_openai_responses.py
          python fix_openai_responses.py
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint and format
        run: |
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
      - name: Strict typing
        run: uv run mypy src
      - name: Test suite
        run: uv run pytest
      - name: Validate provider smoke
        run: |
          mkdir -p .e2h
          uv run e2h ingest openai-responses examples/ingest/openai-responses.json \
            --output .e2h/openai-responses-bundle.json \
            --traces .e2h/openai-responses.jsonl
          uv run python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(".e2h/openai-responses-bundle.json").read_text(encoding="utf-8")
          )
          assert payload["provenance"]["format"] == "openai-responses-json"
          assert payload["provenance"]["redaction_enabled"] is True
          rendered = json.dumps(payload)
          assert "demo@example.com" not in rendered
          assert "opaque-round-trip-data" not in rendered
          events = payload["traces"][0]["events"]
          event_types = [event["event_type"] for event in events]
          assert event_types.count("message.observed") == 3
          assert event_types.count("tool.called") == 1
          assert event_types.count("tool.completed") == 1
          responses = [
              event
              for event in events
              if event["attributes"].get("artifact_kind") == "openai.response"
          ]
          assert len(responses) == 2
          assert responses[0]["payload"]["usage"]["total_tokens"] == 20
          reasoning = next(
              event
              for event in events
              if event["attributes"].get("artifact_kind")
              == "openai.reasoning_summary"
          )
          assert reasoning["payload"]["summary"] == ["Use the declared tool."]
          assert reasoning["payload"]["encrypted_content_present"] is True
          completed = next(
              event for event in events if event["event_type"] == "tool.completed"
          )
          assert completed["attributes"]["linked_call"] is True
          assert len(Path(".e2h/openai-responses.jsonl").read_text().splitlines()) == 1
          PY
      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .bootstrap/openai-responses-ready \
            .github/workflows/bootstrap-openai-responses.yml
          rm -rf .e2h
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add OpenAI Responses evidence ingestion"
          git push origin HEAD:agent/openai-responses-ingest
