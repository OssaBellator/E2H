name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run e2h run examples/smoke/capsule.yaml --workspace . --output .e2h/smoke.json
      - run: >-
          uv run e2h experiment run examples/matrix/experiment.yaml
          --root .
          --output .e2h/matrix.json
          --traces .e2h/matrix.jsonl
          --require-all-pass
      - run: >-
          uv run e2h ingest transcript examples/ingest/transcript.json
          --output .e2h/transcript-bundle.json
          --traces .e2h/transcript.jsonl
      - run: >-
          uv run e2h compile proposal
          .e2h/transcript-bundle.json
          examples/compile/spec.yaml
          --output .e2h/compiler-proposal.json
      - run: >-
          uv run e2h compile verify
          .e2h/compiler-proposal.json
          --workspace .
          --output .e2h/compiler-verification.json
          --require-strong
      - run: >-
          uv run e2h compile review
          .e2h/compiler-proposal.json
          --reviewer ci
          --decision approve
          --output .e2h/compiler-approved.json
      - run: >-
          uv run e2h compile materialize
          .e2h/compiler-approved.json
          .e2h/compiler-verification.json
          --output .e2h/compiled-capsule.yaml
      - run: >-
          uv run e2h run
          .e2h/compiled-capsule.yaml
          --workspace .
          --output .e2h/compiled-run.json
      - run: >-
          uv run e2h compile proposal
          .e2h/transcript-bundle.json
          examples/compile/oracles.yaml
          --output .e2h/oracle-proposal.json
      - run: >-
          uv run e2h compile verify
          .e2h/oracle-proposal.json
          --workspace .
          --output .e2h/oracle-verification.json
          --require-strong
      - run: >-
          uv run e2h compile review
          .e2h/oracle-proposal.json
          --reviewer ci
          --decision approve
          --output .e2h/oracle-approved.json
      - run: >-
          uv run e2h compile materialize
          .e2h/oracle-approved.json
          .e2h/oracle-verification.json
          --output .e2h/oracle-capsule.yaml
      - run: >-
          uv run e2h run
          .e2h/oracle-capsule.yaml
          --workspace .
          --output .e2h/oracle-run.json
      - run: >-
          uv run e2h snapshot create examples .e2h/examples.e2hsnap
          --include compile
          --include ingest
      - run: uv run e2h snapshot verify .e2h/examples.e2hsnap
      - run: uv run e2h snapshot inspect .e2h/examples.e2hsnap --json > .e2h/snapshot-manifest.json
      - run: >-
          uv run e2h snapshot reference .e2h/examples.e2hsnap
          --locator cas://ci/examples
          > .e2h/snapshot-reference.json
      - run: uv run e2h snapshot restore .e2h/examples.e2hsnap .e2h/restored-examples
      - run: test -f .e2h/restored-examples/compile/spec.yaml
      - run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          spec = yaml.safe_load(Path("examples/compile/oracles.yaml").read_text(encoding="utf-8"))
          reference = json.loads(Path(".e2h/snapshot-reference.json").read_text(encoding="utf-8"))
          spec["snapshots"] = [reference]
          Path(".e2h/snapshot-spec.json").write_text(
              json.dumps(spec, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - run: >-
          uv run e2h compile proposal
          .e2h/transcript-bundle.json
          .e2h/snapshot-spec.json
          --output .e2h/snapshot-proposal.json
      - run: >-
          uv run e2h compile verify
          .e2h/snapshot-proposal.json
          --workspace .
          --output .e2h/snapshot-verification.json
          --require-strong
      - run: >-
          uv run e2h compile review
          .e2h/snapshot-proposal.json
          --reviewer ci
          --decision approve
          --output .e2h/snapshot-approved.json
      - run: >-
          uv run e2h compile materialize
          .e2h/snapshot-approved.json
          .e2h/snapshot-verification.json
          --output .e2h/snapshot-capsule.yaml
      - run: >-
          uv run e2h run
          .e2h/snapshot-capsule.yaml
          --workspace .
          --output .e2h/snapshot-run.json
      - run: >-
          uv run e2h ingest otlp examples/ingest/otlp.json
          --output .e2h/otlp-bundle.json
          --traces .e2h/otlp.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: replay-results-python-${{ matrix.python-version }}
          path: |
            .e2h/smoke.json
            .e2h/matrix.json
            .e2h/matrix.jsonl
            .e2h/transcript-bundle.json
            .e2h/transcript.jsonl
            .e2h/otlp-bundle.json
            .e2h/otlp.jsonl
            .e2h/compiler-proposal.json
            .e2h/compiler-verification.json
            .e2h/compiler-approved.json
            .e2h/compiled-capsule.yaml
            .e2h/compiled-run.json
            .e2h/oracle-proposal.json
            .e2h/oracle-verification.json
            .e2h/oracle-approved.json
            .e2h/oracle-capsule.yaml
            .e2h/oracle-run.json
            .e2h/examples.e2hsnap
            .e2h/snapshot-manifest.json
            .e2h/snapshot-reference.json
            .e2h/snapshot-spec.json
            .e2h/snapshot-proposal.json
            .e2h/snapshot-verification.json
            .e2h/snapshot-approved.json
            .e2h/snapshot-capsule.yaml
            .e2h/snapshot-run.json
