name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build verified release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag commit must be reachable from origin/main." >&2
            exit 1
          fi
      - name: Prepare independent clean source copies
        shell: bash
        run: |
          set -euo pipefail
          mkdir source-a source-b
          git archive HEAD | tar -x -C source-a
          git archive HEAD | tar -x -C source-b
      - name: Build release artifacts twice
        shell: bash
        run: |
          set -euo pipefail
          (cd source-a && uv build --out-dir ../dist-a)
          (cd source-b && uv build --out-dir ../dist-b)
          rm -f dist-a/.gitignore dist-b/.gitignore
      - name: Require byte-identical builds
        run: |
          uv run python - <<'PY'
          import hashlib
          from pathlib import Path

          def digests(directory: str) -> dict[str, str]:
              return {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path(directory).iterdir())
                  if path.is_file()
              }

          first = digests("dist-a")
          second = digests("dist-b")
          assert len(first) == 2, first
          assert first == second, (first, second)
          PY
      - name: Seal and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          uv run e2h release seal dist-a \
            --output release-manifest.json \
            --project e2h \
            --version "$VERSION"
          uv run e2h release verify release-manifest.json dist-b --json \
            > release-verification.json
          mkdir -p release/dist
          cp dist-a/*.whl dist-a/*.tar.gz release/dist/
          cp release-manifest.json release-verification.json release/
          (
            cd release
            sha256sum dist/*.tar.gz dist/*.whl \
              release-manifest.json release-verification.json \
              > release-checksums.txt
          )
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest verified distributions
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release
          path: release
      - name: Verify artifact handoff
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c release-checksums.txt
      - name: Generate SLSA provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/dist/*.tar.gz
            release/dist/*.whl

  publish:
    name: Publish verified distributions
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release
          path: release
      - name: Verify artifact handoff
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c release-checksums.txt
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist/
          verify-metadata: true
          print-hash: true
          attestations: true
