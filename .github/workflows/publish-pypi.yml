name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build verified release
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      artifact-name: pypi-release
      validate-release-tag: true

  attest:
    name: Attest verified release bundle and runtime SBOM
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release
          path: release
      - name: Verify artifact handoff
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c release-checksums.txt
      - name: Generate SLSA provenance for release bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/dist/*.tar.gz
            release/dist/*.whl
            release/e2h-sbom.cdx.json
            release/e2h-source.e2hsnap
            release/release-manifest.json
            release/release-verification.json
            release/release-toolchain-verification.json
            release/release-inspection.json
            release/release-source-inspection.json
            release/release-checksums.txt
      - name: Attest CycloneDX runtime SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/dist/*.tar.gz
            release/dist/*.whl
          sbom-path: release/e2h-sbom.cdx.json

  release-draft:
    name: Stage immutable GitHub release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release
          path: release
      - name: Verify artifact handoff and immutable-release policy
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum -c release-checksums.txt
          )
          enabled="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/immutable-releases" \
            --jq '.enabled')"
          if [[ "$enabled" != "true" ]]; then
            echo "Immutable GitHub releases must be enabled before publication." >&2
            exit 1
          fi
      - name: Create or refresh draft release with generated notes
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/dist/*.tar.gz
            release/dist/*.whl
            release/e2h-sbom.cdx.json
            release/e2h-source.e2hsnap
            release/release-manifest.json
            release/release-verification.json
            release/release-toolchain-verification.json
            release/release-inspection.json
            release/release-source-inspection.json
            release/release-checksums.txt
          )
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "A published release already exists for $GITHUB_REF_NAME." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --draft \
              --fail-on-no-commits \
              --generate-notes \
              --title "E2H ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"

  publish:
    name: Publish verified distributions
    needs: [build, attest, release-draft]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release
          path: release
      - name: Verify artifact handoff
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c release-checksums.txt
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  release-publish:
    name: Publish and verify immutable GitHub release
    needs: [build, attest, release-draft, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-release
          path: release
      - name: Verify artifact handoff
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c release-checksums.txt
      - name: Publish immutable release and verify GitHub attestation
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq '.isImmutable')" = "true"

          verified=false
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$GITHUB_REF_NAME" --format json > release-attestation.json; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != "true" ]]; then
            echo "GitHub release attestation did not become verifiable." >&2
            exit 1
          fi

          for asset in \
            release/dist/*.tar.gz \
            release/dist/*.whl \
            release/e2h-sbom.cdx.json \
            release/e2h-source.e2hsnap \
            release/release-manifest.json \
            release/release-verification.json \
            release/release-toolchain-verification.json \
            release/release-inspection.json \
            release/release-source-inspection.json \
            release/release-checksums.txt; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset" > /dev/null
          done
      - name: Upload release attestation verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-attestation
          path: release-attestation.json
          if-no-files-found: error
          retention-days: 30
