name: Refresh release integrity branch

on:
  push:
    branches: [agent/release-artifact-integrity]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/release-artifact-integrity
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run ruff format src/e2h/release.py tests/test_release.py
      - run: uv lock
      - name: Commit deterministic maintenance changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/e2h/release.py tests/test_release.py uv.lock
          git commit -m "Refresh release integrity formatting and lockfile"
          git push origin HEAD:agent/release-artifact-integrity
