name: Pin CI actions maintenance

on:
  push:
    branches: [agent/pin-ci-actions]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/pin-ci-actions
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Pin permanent workflow actions
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/ci.yml'),
              Path('.github/workflows/provider-ingest-ci.yml'),
              Path('.github/workflows/privacy-ci.yml'),
              Path('.github/workflows/store-ci.yml'),
              Path('.github/workflows/capture-clients.yml'),
          ]
          replacements = {
              'uses: actions/checkout@v7': (
                  'uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1'
              ),
              'uses: actions/setup-python@v7': (
                  'uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0'
              ),
              'uses: actions/upload-artifact@v7': (
                  'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1'
              ),
              'uses: actions/upload-artifact@v6': (
                  'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1'
              ),
              'uses: actions/setup-node@v6': (
                  'uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 '
                  '# post-v7.0.0 security fix'
              ),
          }
          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no pinning changes applied to {path}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit action pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            .github/workflows/provider-ingest-ci.yml \
            .github/workflows/privacy-ci.yml \
            .github/workflows/store-ci.yml \
            .github/workflows/capture-clients.yml
          git commit -m "Pin permanent CI actions to reviewed commits"
          git push origin HEAD:agent/pin-ci-actions
