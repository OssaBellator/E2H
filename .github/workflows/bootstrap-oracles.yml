name: Bootstrap declarative oracles

on:
  push:
    branches: [agent/oracle-templates]
    paths: [.bootstrap/oracles-ready]
  pull_request:
    branches: [agent/capsule-compiler]
    paths:
      - .bootstrap/oracles-ready
      - .github/workflows/bootstrap-oracles.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/oracle-templates
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply fail-closed integration patch
        run: |
          python bootstrap_oracles.py
          python fix_oracles.py
      - name: Format and validate
        run: |
          uv sync --extra dev
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run e2h ingest transcript examples/ingest/transcript.json --output .e2h/oracle-bundle.json
          uv run e2h compile validate examples/compile/oracles.yaml
          uv run e2h compile proposal .e2h/oracle-bundle.json examples/compile/oracles.yaml --output .e2h/oracle-proposal.json
          uv run e2h compile verify .e2h/oracle-proposal.json --workspace . --output .e2h/oracle-verification.json --require-strong
          uv run e2h compile review .e2h/oracle-proposal.json --reviewer bootstrap --decision approve --output .e2h/oracle-approved.json
          uv run e2h compile materialize .e2h/oracle-approved.json .e2h/oracle-verification.json --output .e2h/oracle-capsule.yaml
          uv run e2h run .e2h/oracle-capsule.yaml --workspace . --output .e2h/oracle-run.json
      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .bootstrap/oracles-ready
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add declarative oracle templates"
          git push origin HEAD:agent/oracle-templates
