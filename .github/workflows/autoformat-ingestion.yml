name: Autoformat ingestion branch

on:
  push:
    branches: [agent/evidence-ingestion]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/evidence-ingestion
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uvx ruff==0.16.1 format src/e2h/ingest.py tests/test_ingest.py
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/e2h/ingest.py tests/test_ingest.py
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:agent/evidence-ingestion
