name: Fix optimizer adapters

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-optimizer-adapters.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/dspy-gepa-adapters
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply source, test, digest, and lock fixes
        run: |
          uv sync --extra dev
          uv run python - <<'PY'
          from pathlib import Path

          import yaml

          from e2h.genome import capsule_sha256
          from e2h.loader import load_capsule
          from e2h.optimizer_adapters import (
              OptimizerAdapterDocument,
              optimizer_adapter_sha256,
          )
          from e2h.variants import load_variant_document, variant_sha256

          replacements = {
              Path("src/e2h/optimizer_adapters.py"): [
                  ("    variant_sha256,\n", ""),
                  (
                      '        raise OptimizerAdapterError("adapter base capsule digest does not match the supplied capsule")',
                      '        raise OptimizerAdapterError(\n'
                      '            "adapter base capsule digest does not match the supplied capsule"\n'
                      '        )',
                  ),
                  (
                      '        raise OptimizerAdapterError("adapter base variant digest does not match the supplied variant")',
                      '        raise OptimizerAdapterError(\n'
                      '            "adapter base variant digest does not match the supplied variant"\n'
                      '        )',
                  ),
                  (
                      '        raise OptimizerAdapterError("candidate base capsule digest does not match the supplied capsule")',
                      '        raise OptimizerAdapterError(\n'
                      '            "candidate base capsule digest does not match the supplied capsule"\n'
                      '        )',
                  ),
                  (
                      '        raise OptimizerAdapterError("candidate base variant digest does not match the supplied variant")',
                      '        raise OptimizerAdapterError(\n'
                      '            "candidate base variant digest does not match the supplied variant"\n'
                      '        )',
                  ),
              ],
              Path("src/e2h/optimizer_cli.py"): [
                  (
                      "import typer\n",
                      "import typer\nfrom pydantic import BaseModel\n",
                  ),
                  (
                      '    if hasattr(value, "model_dump"):\n'
                      '        payload = value.model_dump(mode="json")\n'
                      '    else:\n'
                      '        payload = value',
                      '    payload = (\n'
                      '        value.model_dump(mode="json") if hasattr(value, "model_dump") else value\n'
                      '    )',
                  ),
                  (
                      "    models = {\n",
                      "    models: dict[str, type[BaseModel]] = {\n",
                  ),
              ],
              Path("tests/test_optimizer_adapters.py"): [
                  (
                      '    variant.variant.metadata["e2h_optimizer"] = {"existing": True}\n'
                      '    candidate = candidate_document(adapter)\n'
                      '    with pytest.raises(OptimizerAdapterError, match="reserved key"):',
                      '    variant.variant.metadata["e2h_optimizer"] = {"existing": True}\n'
                      '    adapter.base_variant_sha256 = variant_sha256(variant.variant)\n'
                      '    candidate = candidate_document(adapter)\n'
                      '    with pytest.raises(OptimizerAdapterError, match="reserved key"):',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          capsule = load_capsule(Path("examples/genome/base.yaml"))
          variant = load_variant_document(Path("examples/variants/candidate.yaml"))
          base_capsule_sha256 = capsule_sha256(capsule)
          base_variant_sha256 = variant_sha256(variant.variant)

          adapter_path = Path("examples/optimizer/adapter.yaml")
          adapter_payload = yaml.safe_load(adapter_path.read_text(encoding="utf-8"))
          adapter_payload["base_capsule_sha256"] = base_capsule_sha256
          adapter_payload["base_variant_sha256"] = base_variant_sha256
          adapter = OptimizerAdapterDocument.model_validate(adapter_payload)
          adapter_path.write_text(
              yaml.safe_dump(adapter.model_dump(mode="json"), sort_keys=False),
              encoding="utf-8",
          )

          candidate_path = Path("examples/optimizer/candidate.yaml")
          candidate_payload = yaml.safe_load(candidate_path.read_text(encoding="utf-8"))
          candidate_payload["adapter_sha256"] = optimizer_adapter_sha256(adapter)
          candidate_payload["base_capsule_sha256"] = base_capsule_sha256
          candidate_payload["base_variant_sha256"] = base_variant_sha256
          candidate_path.write_text(
              yaml.safe_dump(candidate_payload, sort_keys=False),
              encoding="utf-8",
          )
          PY
          uv lock
          uv run ruff format .
          uv run ruff check --fix --unsafe-fixes .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No normalization changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            examples/optimizer/adapter.yaml \
            examples/optimizer/candidate.yaml \
            src/e2h/optimizer_adapters.py \
            src/e2h/optimizer_cli.py \
            tests/test_optimizer_adapters.py \
            uv.lock
          git commit -m "Normalize optimizer adapters and example identities"
          git push origin HEAD:agent/dspy-gepa-adapters
