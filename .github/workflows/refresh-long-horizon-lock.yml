name: Refresh long-horizon branch

on:
  push:
    branches: [agent/long-horizon-benchmark]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/long-horizon-benchmark
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run ruff check . --fix
      - run: uv run ruff format .
      - run: uv lock
      - name: Commit deterministic maintenance changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format long-horizon benchmark and refresh lockfile"
          git push origin HEAD:agent/long-horizon-benchmark
