name: Refresh capture lockfile

on:
  push:
    branches: [agent/capture-clients]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/capture-clients
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv lock
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh uv lockfile for capture clients"
          git push origin HEAD:agent/capture-clients
