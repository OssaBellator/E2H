name: Harden benchmark environments

on:
  push:
    branches: [agent/reproducible-benchmark-environments]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/reproducible-benchmark-environments
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Apply review hardening
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_from(path: str, marker: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              index = text.find(marker)
              if index < 0:
                  raise SystemExit(f"marker not found in {path}: {marker!r}")
              target.write_text(text[:index] + replacement, encoding="utf-8")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              begin = text.find(start)
              finish = text.find(end, begin + len(start)) if begin >= 0 else -1
              if begin < 0 or finish < 0:
                  raise SystemExit(f"replacement bounds not found in {path}")
              target.write_text(text[:begin] + replacement + text[finish:], encoding="utf-8")

          def append_once(path: str, marker: str, block: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker not in text:
                  target.write_text(text.rstrip() + "\n\n\n" + block.strip() + "\n", encoding="utf-8")

          # PR #25: never advertise credentials embedded in an Agent Card public URL.
          replace_once(
              "src/e2h/a2a_agent.py",
              '''    if parsed.scheme not in {"http", "https"} or not parsed.netloc:\n        raise A2AAgentError("public URL must use http or https and include a host")\n    if parsed.query or parsed.fragment:\n''',
              '''    if parsed.scheme not in {"http", "https"} or not parsed.netloc:\n        raise A2AAgentError("public URL must use http or https and include a host")\n    if parsed.username is not None or parsed.password is not None:\n        raise A2AAgentError("public URL must not contain credentials")\n    if parsed.query or parsed.fragment:\n''',
          )
          append_once(
              "tests/test_a2a_agent.py",
              "test_public_url_rejects_embedded_credentials",
              '''def test_public_url_rejects_embedded_credentials() -> None:\n    with pytest.raises(A2AAgentError, match="credentials"):\n        _normalized_public_url("https://user:secret@example.com")''',
          )

          # PR #26: use E2H's shared duplicate-key-rejecting document loader.
          replace_once(
              "src/e2h/capture.py",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n\nfrom e2h.document import load_mapping_document\n",
          )
          replace_once(
              "src/e2h/capture.py",
              '''def _reject_json_constant(value: str) -> None:\n    raise ValueError(f"non-standard JSON constant: {value}")\n\n\n''',
              "",
          )
          replace_from(
              "src/e2h/capture.py",
              "def load_capture_document(path: Path) -> CaptureDocument:\n",
              '''def load_capture_document(path: Path) -> CaptureDocument:\n    """Load one bounded strict JSON capture document and verify all content digests."""\n    if path.suffix.lower() != ".json":\n        raise CaptureError("capture must use .json")\n    try:\n        payload = load_mapping_document(\n            path,\n            noun="capture",\n            max_bytes=_MAX_CAPTURE_BYTES,\n        )\n        return CaptureDocument.model_validate(payload)\n    except ValueError as exc:\n        if isinstance(exc, CaptureError):\n            raise\n        raise CaptureError(str(exc)) from exc\n''',
          )
          append_once(
              "tests/test_capture.py",
              "test_capture_loader_rejects_duplicate_json_keys",
              '''def test_capture_loader_rejects_duplicate_json_keys(tmp_path: Path) -> None:\n    source = tmp_path / "duplicate.json"\n    source.write_text('{"schema_version":"0.1","schema_version":"0.1"}', encoding="utf-8")\n    with pytest.raises(CaptureError, match="duplicate object key"):\n        load_capture_document(source)''',
          )

          # PR #27: strict loading, defensive revalidation, and metadata privacy scanning.
          replace_once("src/e2h/benchmark.py", "import yaml\n", "")
          replace_once(
              "src/e2h/benchmark.py",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n\nfrom e2h.document import load_mapping_document\n",
          )
          replace_once(
              "src/e2h/benchmark.py",
              "\n\nclass FailurePatternVerification(StrictModel):\n",
              '''\n\ndef _validated_failure_pattern_corpus(\n    corpus: FailurePatternCorpus,\n) -> FailurePatternCorpus:\n    try:\n        return FailurePatternCorpus.model_validate(corpus.model_dump(mode="json"))\n    except ValueError as exc:\n        raise BenchmarkError(f"invalid benchmark corpus: {exc}") from exc\n\n\nclass FailurePatternVerification(StrictModel):\n''',
          )
          replace_once(
              "src/e2h/benchmark.py",
              '''def failure_pattern_corpus_sha256(corpus: FailurePatternCorpus) -> str:\n    """Return the canonical digest of one normalized benchmark corpus."""\n    payload = json.dumps(\n''',
              '''def failure_pattern_corpus_sha256(corpus: FailurePatternCorpus) -> str:\n    """Return the canonical digest of one normalized benchmark corpus."""\n    corpus = _validated_failure_pattern_corpus(corpus)\n    payload = json.dumps(\n''',
          )
          replace_once(
              "src/e2h/benchmark.py",
              '            payload={"corpus_id": corpus.id},\n',
              '            payload={"corpus_id": corpus.id, "metadata": corpus.metadata},\n',
          )
          replace_once(
              "src/e2h/benchmark.py",
              '''def verify_failure_pattern_corpus(corpus: FailurePatternCorpus) -> FailurePatternVerification:\n    """Verify provenance claims and reject residual common PII/secret patterns."""\n    try:\n''',
              '''def verify_failure_pattern_corpus(corpus: FailurePatternCorpus) -> FailurePatternVerification:\n    """Verify provenance claims and reject residual common PII/secret patterns."""\n    corpus = _validated_failure_pattern_corpus(corpus)\n    try:\n''',
          )
          replace_from(
              "src/e2h/benchmark.py",
              "def _reject_json_constant(value: str) -> None:\n",
              '''def load_failure_pattern_corpus(path: Path) -> FailurePatternCorpus:\n    """Load one bounded strict JSON/YAML failure-pattern corpus."""\n    try:\n        payload = load_mapping_document(\n            path,\n            noun="benchmark corpus",\n            max_bytes=_MAX_CORPUS_BYTES,\n        )\n        return FailurePatternCorpus.model_validate(payload)\n    except ValueError as exc:\n        if isinstance(exc, BenchmarkError):\n            raise\n        raise BenchmarkError(f"invalid benchmark corpus: {exc}") from exc\n''',
          )
          append_once(
              "tests/test_benchmark.py",
              "test_benchmark_loader_rejects_duplicate_mapping_keys",
              '''def test_benchmark_loader_rejects_duplicate_mapping_keys(tmp_path: Path) -> None:\n    source = tmp_path / "duplicate.json"\n    source.write_text('{"schema_version":"0.1","id":"one","id":"two"}', encoding="utf-8")\n    with pytest.raises(BenchmarkError, match="duplicate object key"):\n        load_failure_pattern_corpus(source)\n\n\ndef test_benchmark_privacy_scan_includes_corpus_metadata() -> None:\n    corpus = FailurePatternCorpus(\n        id="metadata-privacy",\n        title="Metadata privacy",\n        patterns=[_pattern()],\n        metadata={"contact": "reviewer@example.com"},\n    )\n    verification = verify_failure_pattern_corpus(corpus)\n    assert verification.verified is False\n    assert verification.privacy_findings >= 1''',
          )

          # PR #28: strict loading and defensive revalidation at every public boundary.
          replace_once("src/e2h/long_horizon.py", "import yaml\n", "")
          replace_once(
              "src/e2h/long_horizon.py",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n\nfrom e2h.document import load_mapping_document\n",
          )
          replace_once(
              "src/e2h/long_horizon.py",
              '''def _reject_json_constant(value: str) -> None:\n    raise ValueError(f"non-standard JSON constant: {value}")\n\n\n''',
              "",
          )
          replace_once(
              "src/e2h/long_horizon.py",
              "\n\nclass PublicLongHorizonTurn(StrictModel):\n",
              '''\n\ndef _validated_long_horizon_corpus(corpus: LongHorizonCorpus) -> LongHorizonCorpus:\n    try:\n        return LongHorizonCorpus.model_validate(corpus.model_dump(mode="json"))\n    except ValueError as exc:\n        raise LongHorizonError(f"invalid long-horizon corpus: {exc}") from exc\n\n\nclass PublicLongHorizonTurn(StrictModel):\n''',
          )
          replace_once(
              "src/e2h/long_horizon.py",
              "    predictions: list[LongHorizonProbePrediction] = Field(min_length=1, max_length=100_000)\n",
              "    predictions: list[LongHorizonProbePrediction] = Field(default_factory=list, max_length=100_000)\n",
          )
          replace_once(
              "src/e2h/long_horizon.py",
              "\n\nclass LongHorizonTaskScore(StrictModel):\n",
              '''\n\ndef _validated_long_horizon_predictions(\n    predictions: LongHorizonPredictionDocument,\n) -> LongHorizonPredictionDocument:\n    try:\n        return LongHorizonPredictionDocument.model_validate(predictions.model_dump(mode="json"))\n    except ValueError as exc:\n        raise LongHorizonError(f"invalid long-horizon predictions: {exc}") from exc\n\n\nclass LongHorizonTaskScore(StrictModel):\n''',
          )
          replace_once(
              "src/e2h/long_horizon.py",
              '''def long_horizon_corpus_sha256(corpus: LongHorizonCorpus) -> str:\n    """Return the private canonical identity including evaluator labels."""\n    return hashlib.sha256(_canonical_json_bytes(corpus.model_dump(mode="json"))).hexdigest()\n''',
              '''def long_horizon_corpus_sha256(corpus: LongHorizonCorpus) -> str:\n    """Return the private canonical identity including evaluator labels."""\n    corpus = _validated_long_horizon_corpus(corpus)\n    return hashlib.sha256(_canonical_json_bytes(corpus.model_dump(mode="json"))).hexdigest()\n''',
          )
          replace_once(
              "src/e2h/long_horizon.py",
              '''def export_public_long_horizon_corpus(corpus: LongHorizonCorpus) -> PublicLongHorizonCorpus:\n    """Remove evaluator-side updates and metadata from a candidate-visible corpus."""\n    return PublicLongHorizonCorpus(\n''',
              '''def export_public_long_horizon_corpus(corpus: LongHorizonCorpus) -> PublicLongHorizonCorpus:\n    """Remove evaluator-side updates and metadata from a candidate-visible corpus."""\n    corpus = _validated_long_horizon_corpus(corpus)\n    return PublicLongHorizonCorpus(\n''',
          )
          replace_once(
              "src/e2h/long_horizon.py",
              '''def evaluate_long_horizon_predictions(\n    corpus: LongHorizonCorpus,\n    predictions: LongHorizonPredictionDocument,\n) -> LongHorizonEvaluationReport:\n    """Score exact active-constraint maps without returning hidden expected mappings."""\n    expected_public_sha256 = public_long_horizon_corpus_sha256(corpus)\n''',
              '''def evaluate_long_horizon_predictions(\n    corpus: LongHorizonCorpus,\n    predictions: LongHorizonPredictionDocument,\n) -> LongHorizonEvaluationReport:\n    """Score exact active-constraint maps without returning hidden expected mappings."""\n    corpus = _validated_long_horizon_corpus(corpus)\n    predictions = _validated_long_horizon_predictions(predictions)\n    expected_public_sha256 = public_long_horizon_corpus_sha256(corpus)\n''',
          )
          replace_from(
              "src/e2h/long_horizon.py",
              "def load_long_horizon_corpus(path: Path) -> LongHorizonCorpus:\n",
              '''def load_long_horizon_corpus(path: Path) -> LongHorizonCorpus:\n    """Load one bounded strict JSON/YAML labelled long-horizon corpus."""\n    try:\n        payload = load_mapping_document(\n            path,\n            noun="long-horizon corpus",\n            max_bytes=_MAX_CORPUS_BYTES,\n        )\n        return LongHorizonCorpus.model_validate(payload)\n    except ValueError as exc:\n        if isinstance(exc, LongHorizonError):\n            raise\n        raise LongHorizonError(f"invalid long-horizon corpus: {exc}") from exc\n\n\ndef load_long_horizon_predictions(path: Path) -> LongHorizonPredictionDocument:\n    """Load one bounded strict JSON prediction document."""\n    if path.suffix.lower() != ".json":\n        raise LongHorizonError("long-horizon predictions must use .json")\n    try:\n        payload = load_mapping_document(\n            path,\n            noun="long-horizon predictions",\n            max_bytes=_MAX_CORPUS_BYTES,\n        )\n        return LongHorizonPredictionDocument.model_validate(payload)\n    except ValueError as exc:\n        if isinstance(exc, LongHorizonError):\n            raise\n        raise LongHorizonError(f"invalid long-horizon predictions: {exc}") from exc\n''',
          )
          replace_once(
              "tests/test_long_horizon.py",
              '''    task = _simple_task()\n    with pytest.raises(ValidationError, match="after_turn_id"):\n        task.model_copy(update={"probes": [LongHorizonProbe(id="p2", after_turn_id="missing")]})\n''',
              '''    task = _simple_task()\n    mutated = task.model_copy(\n        update={"probes": [LongHorizonProbe(id="p2", after_turn_id="missing")]}\n    )\n    corpus = LongHorizonCorpus(id="mutated", title="Mutated", tasks=[mutated])\n    with pytest.raises(LongHorizonError, match="after_turn_id"):\n        export_public_long_horizon_corpus(corpus)\n''',
          )
          append_once(
              "tests/test_long_horizon.py",
              "test_empty_prediction_document_scores_zero",
              '''def test_empty_prediction_document_scores_zero() -> None:\n    corpus = load_long_horizon_corpus(SEED)\n    predictions = LongHorizonPredictionDocument(\n        public_corpus_sha256=public_long_horizon_corpus_sha256(corpus),\n        predictions=[],\n    )\n    report = evaluate_long_horizon_predictions(corpus, predictions)\n    assert report.submitted == 0\n    assert report.correct == 0\n    assert report.score == 0.0\n\n\ndef test_long_horizon_loader_rejects_duplicate_mapping_keys(tmp_path: Path) -> None:\n    source = tmp_path / "duplicate.json"\n    source.write_text('{"schema_version":"0.1","id":"one","id":"two"}', encoding="utf-8")\n    with pytest.raises(LongHorizonError, match="duplicate object key"):\n        load_long_horizon_corpus(source)''',
          )

          # PR #29: strict locks, race-aware scanning, public CLI integration, and exact ordering.
          replace_once("src/e2h/benchmark_env.py", "import os\n", "")
          replace_once("src/e2h/benchmark_env.py", "import yaml\n", "")
          replace_once(
              "src/e2h/benchmark_env.py",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n",
              "from pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n\nfrom e2h.document import load_mapping_document\n",
          )
          replace_between(
              "src/e2h/benchmark_env.py",
              "def _read_mapping(path: Path, *, noun: str) -> dict[str, Any]:\n",
              "class BenchmarkEnvironmentKind(StrEnum):\n",
              '''def _read_mapping(path: Path, *, noun: str) -> dict[str, Any]:\n    try:\n        return load_mapping_document(path, noun=noun, max_bytes=_MAX_DOCUMENT_BYTES)\n    except ValueError as exc:\n        raise BenchmarkEnvironmentError(str(exc)) from exc\n\n\n''',
          )
          replace_once(
              "src/e2h/benchmark_env.py",
              '''        try:\n            size = path.stat().st_size\n        except OSError as exc:\n            raise BenchmarkEnvironmentError(f"unable to stat environment file {relative}: {exc}") from exc\n        total_bytes += size\n''',
              '''        try:\n            before = path.stat()\n        except OSError as exc:\n            raise BenchmarkEnvironmentError(\n                f"unable to stat environment file {relative}: {exc}"\n            ) from exc\n        size = before.st_size\n        total_bytes += size\n''',
          )
          replace_once(
              "src/e2h/benchmark_env.py",
              '''        except OSError as exc:\n            raise BenchmarkEnvironmentError(f"unable to hash environment file {relative}: {exc}") from exc\n        mode = path.stat().st_mode\n        files.append(\n''',
              '''        except OSError as exc:\n            raise BenchmarkEnvironmentError(\n                f"unable to hash environment file {relative}: {exc}"\n            ) from exc\n        try:\n            after = path.stat()\n        except OSError as exc:\n            raise BenchmarkEnvironmentError(\n                f"unable to restat environment file {relative}: {exc}"\n            ) from exc\n        identity_before = (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns)\n        identity_after = (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)\n        if identity_before != identity_after:\n            raise BenchmarkEnvironmentError(\n                f"environment file changed while hashing: {relative}"\n            )\n        mode = after.st_mode\n        files.append(\n''',
          )
          replace_once(
              "src/e2h/benchmark_env.py",
              '''    expected_ids = [environment.id for environment in suite.environments]\n    if set(locked) != set(expected_ids):\n        raise BenchmarkEnvironmentError("environment lock entries do not match suite environments")\n''',
              '''    expected_ids = [environment.id for environment in suite.environments]\n    locked_ids = [entry.id for entry in lock.environments]\n    if locked_ids != expected_ids:\n        raise BenchmarkEnvironmentError(\n            "environment lock entries must match suite environments in order"\n        )\n''',
          )
          replace_once(
              "src/e2h/benchmark_env.py",
              "        shutil.copytree(source, resolved_destination, symlinks=False, copy_function=shutil.copy2)\n",
              "        shutil.copytree(source, resolved_destination, symlinks=True, copy_function=shutil.copy2)\n",
          )
          replace_once(
              "src/e2h/benchmark_env.py",
              '''    except OSError as exc:\n        raise BenchmarkEnvironmentError(f"unable to materialize benchmark environment: {exc}") from exc\n''',
              '''    except OSError as exc:\n        raise BenchmarkEnvironmentError(\n            f"unable to materialize benchmark environment: {exc}"\n        ) from exc\n''',
          )
          replace_once(
              "src/e2h/benchmark_cli.py",
              "from e2h.benchmark import (\n",
              "from e2h.benchmark import (\n",
          )
          replace_once(
              "src/e2h/benchmark_cli.py",
              "from e2h.long_horizon_cli import long_horizon_app\n",
              "from e2h.benchmark_env_cli import environments_app\nfrom e2h.long_horizon_cli import long_horizon_app\n",
          )
          replace_once(
              "src/e2h/benchmark_cli.py",
              '''benchmark_app = typer.Typer(no_args_is_help=True, help="Validate E2H community benchmark corpora.")\nbenchmark_app.add_typer(long_horizon_app, name="long-horizon")\n''',
              '''benchmark_app = typer.Typer(no_args_is_help=True, help="Validate E2H community benchmark corpora.")\nbenchmark_app.add_typer(environments_app, name="environments")\nbenchmark_app.add_typer(long_horizon_app, name="long-horizon")\n''',
          )
          replace_once(
              "tests/test_benchmark_env.py",
              "from e2h.benchmark_env_cli import environments_app\n",
              "from e2h.benchmark_cli import benchmark_app\nfrom e2h.benchmark_env_cli import environments_app\n",
          )
          replace_between(
              "tests/test_benchmark_env.py",
              '    (environment / "src" / "task.py").write_text(\n',
              "    result = _run_checker(environment)\n",
              r'''    (environment / "src" / "task.py").write_text(
        """def normalize_identifier(value: str) -> str:
    value = value.strip()
    pieces = []
    separator = False
    for char in value:
        if char in " \\t\\n\\r\\v\\f_-":
            separator = True
            continue
        if separator and pieces:
            pieces.append("-")
        separator = False
        if "A" <= char <= "Z":
            char = chr(ord(char) + 32)
        pieces.append(char)
    result = "".join(pieces).strip("-")
    if not result:
        raise ValueError("normalized identifier is empty")
    return result
""",
        encoding="utf-8",
    )
''',
          )
          append_once(
              "tests/test_benchmark_env.py",
              "test_environment_loader_rejects_duplicate_mapping_keys",
              '''def test_environment_loader_rejects_duplicate_mapping_keys(tmp_path: Path) -> None:\n    source = tmp_path / "duplicate.json"\n    source.write_text('{"schema_version":"0.1","id":"one","id":"two"}', encoding="utf-8")\n    with pytest.raises(BenchmarkEnvironmentError, match="duplicate object key"):\n        load_benchmark_environment_suite(source)\n\n\ndef test_environment_lock_requires_suite_order() -> None:\n    suite = load_benchmark_environment_suite(SUITE_PATH)\n    lock = seal_benchmark_environment_suite(suite, root=ROOT)\n    reordered = lock.model_copy(update={"environments": list(reversed(lock.environments))})\n    with pytest.raises(BenchmarkEnvironmentError, match="in order"):\n        verify_benchmark_environment_suite(suite, reordered, root=ROOT)\n\n\ndef test_public_benchmark_cli_exposes_environment_commands() -> None:\n    result = runner.invoke(benchmark_app, ["environments", "schema", "--kind", "suite"])\n    assert result.exit_code == 0\n    assert json.loads(result.stdout)["type"] == "object"''',
          )

          # Release metadata and roadmap drift accumulated across PRs #25-#29.
          replace_once("pyproject.toml", 'version = "0.23.0"\n', 'version = "0.24.0"\n')
          replace_once("src/e2h/__init__.py", '__version__ = "0.18.0"\n', '__version__ = "0.24.0"\n')
          replace_once(
              "ROADMAP.md",
              '''- [x] Sanitized real-world failure patterns.\n- Long-horizon constraint retention and correction tasks.\n- Reproducible coding, research, and browser environments.\n''',
              '''- [x] Sanitized real-world failure patterns.\n- [x] Long-horizon constraint retention and correction tasks.\n- [x] Reproducible coding, research, and browser environments.\n''',
          )
          PY
      - run: uv run ruff check . --fix
      - run: uv run ruff format .
      - run: uv lock
      - name: Generate environment content lock
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from e2h.benchmark_env import load_benchmark_environment_suite, seal_benchmark_environment_suite

          suite = load_benchmark_environment_suite(Path("benchmarks/environments/suite.json"))
          lock = seal_benchmark_environment_suite(suite, root=Path("."))
          Path("benchmarks/environments/suite.lock.json").write_text(
              lock.model_dump_json(indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Remove one-use maintenance workflows
        run: |
          rm -f .github/workflows/refresh-benchmark-environments.yml
          rm -f .github/workflows/refresh-long-horizon-lock.yml
      - name: Commit reviewed head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden benchmark integrations after review"
          git push origin HEAD:agent/reproducible-benchmark-environments
