name: Apply PR 15 review fixes

on:
  push:
    branches: ["agent/gemini-generate-content-ingest"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          privacy_path = Path("src/e2h/privacy.py")
          privacy = privacy_path.read_text(encoding="utf-8")
          old_redact = '''            redacted[redacted_key] = _redact_value(
                item,
                _pointer_child(location, redacted_key),
                records,
                policy,
                custom_patterns,
                allowed,
            )'''
          new_redact = '''            redacted[redacted_key] = _redact_value(
                item,
                f"{location}/<value:{index}>",
                records,
                policy,
                custom_patterns,
                allowed,
            )'''
          old_scan = '''            yield f"{location}/<key:{index}>", str(key)
            yield from _iter_strings(item, _pointer_child(location, str(key)))'''
          new_scan = '''            yield f"{location}/<key:{index}>", str(key)
            yield from _iter_strings(item, f"{location}/<value:{index}>")'''
          if privacy.count(old_redact) != 1 or privacy.count(old_scan) != 1:
              raise SystemExit("privacy integration anchors changed")
          privacy_path.write_text(
              privacy.replace(old_redact, new_redact).replace(old_scan, new_scan),
              encoding="utf-8",
          )

          privacy_test_path = Path("tests/test_privacy.py")
          privacy_tests = privacy_test_path.read_text(encoding="utf-8")
          privacy_anchor = "\ndef test_disabled_redaction_produces_hashed_residual_review() -> None:\n"
          privacy_addition = '''

def test_review_locations_never_expose_raw_mapping_keys() -> None:
    sensitive_key = "allowed@example.com"
    policy = RedactionPolicy(allow_values=[sensitive_key])
    outcome = apply_redaction_policy(
        [trace_with_payload({sensitive_key: "password=supersecret123"})],
        policy=policy,
    )
    report = outcome.review.model_dump_json()
    records = json.dumps([record.model_dump(mode="json") for record in outcome.records])
    assert sensitive_key not in report
    assert sensitive_key not in records
    assert all("<value:" in record.location for record in outcome.records)
'''
          if privacy_anchor not in privacy_tests or "test_review_locations_never_expose_raw_mapping_keys" in privacy_tests:
              raise SystemExit("privacy test integration anchor changed")
          privacy_test_path.write_text(
              privacy_tests.replace(privacy_anchor, privacy_addition + privacy_anchor),
              encoding="utf-8",
          )

          anthropic_path = Path("src/e2h/anthropic_messages.py")
          anthropic = anthropic_path.read_text(encoding="utf-8")
          old_content = '''        content = self.response.get("content")
        blocks = _content_list(content, "response.content")'''
          new_content = '''        content = self.response.get("content")
        if not isinstance(content, list):
            raise ValueError("response.content must be an array")
        blocks = _content_list(content, "response.content")'''
          if anthropic.count(old_content) != 1:
              raise SystemExit("Anthropic integration anchor changed")
          anthropic_path.write_text(anthropic.replace(old_content, new_content), encoding="utf-8")

          anthropic_test_path = Path("tests/test_anthropic_messages.py")
          anthropic_tests = anthropic_test_path.read_text(encoding="utf-8")
          anthropic_anchor = '''        (
            lambda data: data["records"][0]["response"].update({"usage": {}}),
            "response.usage.input_tokens must be a non-negative integer",
        ),'''
          anthropic_replacement = anthropic_anchor + '''
        (
            lambda data: data["records"][0]["response"].update({"content": "plain text"}),
            "response.content must be an array",
        ),'''
          if anthropic_tests.count(anthropic_anchor) != 1 or "response.content must be an array" in anthropic_tests:
              raise SystemExit("Anthropic test integration anchor changed")
          anthropic_test_path.write_text(
              anthropic_tests.replace(anthropic_anchor, anthropic_replacement),
              encoding="utf-8",
          )

          gemini_path = Path("src/e2h/gemini_generate_content.py")
          gemini = gemini_path.read_text(encoding="utf-8")
          old_binary = '_BINARY_KEYS = frozenset({"data", "thought_signature", "thoughtSignature"})'
          new_binary = '_BINARY_KEYS = frozenset({"thought_signature", "thoughtSignature"})'
          if gemini.count(old_binary) != 1:
              raise SystemExit("Gemini integration anchor changed")
          gemini_path.write_text(gemini.replace(old_binary, new_binary), encoding="utf-8")

          gemini_test_path = Path("tests/test_gemini_generate_content.py")
          gemini_tests = gemini_test_path.read_text(encoding="utf-8")
          gemini_anchor = "\ndef test_default_redaction_covers_system_messages_args_and_results() -> None:\n"
          gemini_addition = '''

def test_function_arguments_preserve_observable_data_fields() -> None:
    data = archive_document()
    args = {"data": {"customer_id": "CUS-123"}}
    data["records"][0]["response"]["candidates"][0]["content"]["parts"][1][
        "functionCall"
    ]["args"] = copy.deepcopy(args)
    data["records"][1]["contents"][1]["parts"][1]["functionCall"]["args"] = copy.deepcopy(
        args
    )
    bundle = bundle_from(data, redact=False)
    called = next(
        event
        for event in bundle.traces[0].events
        if event.event_type is TraceEventType.TOOL_CALLED
        and event.attributes.get("call_id") == "call_1"
    )
    assert called.payload["args"] == args
'''
          if gemini_anchor not in gemini_tests or "test_function_arguments_preserve_observable_data_fields" in gemini_tests:
              raise SystemExit("Gemini test integration anchor changed")
          gemini_test_path.write_text(
              gemini_tests.replace(gemini_anchor, gemini_addition + gemini_anchor),
              encoding="utf-8",
          )
          Path(".github/workflows/review-fix-pr15.yml").unlink()
          PY
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest tests/test_privacy.py tests/test_privacy_ingest.py tests/test_privacy_cli.py tests/test_anthropic_messages.py tests/test_anthropic_messages_cli.py tests/test_gemini_generate_content.py tests/test_gemini_generate_content_cli.py
      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve provider evidence safely"
          git push
