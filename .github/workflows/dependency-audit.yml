name: Locked dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked audit tool and runtime dependencies
        run: uv sync --locked --no-default-groups --group audit --no-install-project

      - name: Export exact runtime dependency set
        run: |
          mkdir -p .e2h
          uv export \
            --format requirements.txt \
            --locked \
            --no-default-groups \
            --no-emit-local \
            --output-file .e2h/runtime-requirements.txt

      - name: Audit exact runtime dependency set
        run: |
          uv run --no-sync pip-audit \
            --requirement .e2h/runtime-requirements.txt \
            --no-deps \
            --disable-pip \
            --require-hashes \
            --vulnerability-service pypi \
            --aliases on \
            --desc off \
            --progress-spinner off

      - name: Audit exact isolated build dependency set
        run: |
          uv run --no-sync pip-audit \
            --requirement build-constraints.txt \
            --no-deps \
            --disable-pip \
            --require-hashes \
            --vulnerability-service pypi \
            --aliases on \
            --desc off \
            --progress-spinner off
