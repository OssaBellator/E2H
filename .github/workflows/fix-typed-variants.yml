name: Fix typed variants

on:
  push:
    branches: [agent/typed-variants]
    paths:
      - .github/workflows/fix-typed-variants.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-typed-variants.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/typed-variants
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply compatibility and formatting fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/e2h/experiment.py"): [
                  (
                      '    variant_sha256: str = Field(pattern=r"^[0-9a-f]{64}$")',
                      '    variant_sha256: str | None = Field(default=None, pattern=r"^[0-9a-f]{64}$")',
                  ),
              ],
              Path("src/e2h/variants.py"): [
                  (
                      '_RESERVED_VARIANT_ENV = frozenset(\n'
                      '    {"E2H_VARIANT_ID", "E2H_REPETITION", "E2H_VARIANT_SHA256"}\n'
                      ')',
                      '_RESERVED_VARIANT_ENV = frozenset('
                      '{"E2H_VARIANT_ID", "E2H_REPETITION", "E2H_VARIANT_SHA256"}'
                      ')',
                  ),
                  (
                      'Capability = Literal["text", "tools", "vision", "json"]\n\n\n'
                      'class RouteTarget(StrictModel):',
                      'Capability = Literal["text", "tools", "vision", "json"]\n\n\n'
                      'def _default_capabilities() -> list[Capability]:\n'
                      '    return ["text"]\n\n\n'
                      'class RouteTarget(StrictModel):',
                  ),
                  (
                      '    capabilities: list[Capability] = Field('
                      'default_factory=lambda: ["text"], min_length=1)',
                      '    capabilities: list[Capability] = Field('
                      'default_factory=_default_capabilities, min_length=1)',
                  ),
              ],
              Path("tests/test_typed_experiment_variants.py"): [
                  (
                      '    code = (\n'
                      '        "import os; "\n'
                      '        "print(os.environ[\'E2H_VARIANT_ID\']); "\n'
                      '        "print(os.environ[\'E2H_VARIANT_SHA256\'])"\n'
                      '    )',
                      '    code = "import os; print(os.environ[\'E2H_VARIANT_ID\']); '
                      'print(os.environ[\'E2H_VARIANT_SHA256\'])"',
                  ),
              ],
              Path("tests/test_variants.py"): [
                  (
                      '                "items": [\n'
                      '                    {"id": "one", "kind": "literal", '
                      '"content": "123456", "max_chars": 6}\n'
                      '                ],',
                      '                "items": [{"id": "one", "kind": "literal", '
                      '"content": "123456", "max_chars": 6}],',
                  ),
                  (
                      '                "items": [\n'
                      '                    {"id": "one", "kind": "literal", '
                      '"content": "abc", "max_chars": 4}\n'
                      '                ],',
                      '                "items": [{"id": "one", "kind": "literal", '
                      '"content": "abc", "max_chars": 4}],',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text not found in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          uv sync --extra dev
          uv run ruff format .
          uv run ruff check .
          uv run mypy src
          uv run pytest
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/e2h/experiment.py src/e2h/variants.py tests/test_typed_experiment_variants.py tests/test_variants.py
          git commit -m "Preserve legacy experiment artifacts and format variants"
          git push origin HEAD:agent/typed-variants
