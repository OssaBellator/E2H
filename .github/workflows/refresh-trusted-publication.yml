name: Refresh trusted publication lockfile

on:
  push:
    branches: [agent/oidc-pypi-publication]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/oidc-pypi-publication
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv lock
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh uv lockfile for trusted publication"
          git push origin HEAD:agent/oidc-pypi-publication
