name: Reusable verified release build

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name for the verified release bundle artifact.
        required: true
        type: string
      validate-release-tag:
        description: Require vMAJOR.MINOR.PATCH to match pyproject and be reachable from main.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build verified release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: "1704067200"
      UV_PREVIEW_FEATURES: "sbom-export"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Install locked release dependencies
        run: uv sync --locked --no-default-groups --no-install-project
      - name: Validate release tag and main ancestry
        if: ${{ inputs.validate-release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          VERSION="$(.venv/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag commit must be reachable from origin/main." >&2
            exit 1
          fi
      - name: Prepare independent clean source copies
        shell: bash
        run: |
          set -euo pipefail
          mkdir source-a source-b
          git archive HEAD | tar -x -C source-a
          git archive HEAD | tar -x -C source-b
      - name: Build release artifacts twice
        shell: bash
        run: |
          set -euo pipefail
          (cd source-a && uv build --build-constraint build-constraints.txt --require-hashes --out-dir ../dist-a)
          (cd source-b && uv build --build-constraint build-constraints.txt --require-hashes --out-dir ../dist-b)
          rm -f dist-a/.gitignore dist-b/.gitignore
      - name: Export and canonicalize runtime SBOM twice
        shell: bash
        run: |
          set -euo pipefail
          (cd source-a && uv export --locked --no-default-groups --format cyclonedx1.5 --output-file ../sbom-a.raw.json)
          (cd source-b && uv export --locked --no-default-groups --format cyclonedx1.5 --output-file ../sbom-b.raw.json)
          PYTHONPATH=src .venv/bin/python -m e2h release canonicalize-sbom sbom-a.raw.json --output sbom-a.cdx.json
          PYTHONPATH=src .venv/bin/python -m e2h release canonicalize-sbom sbom-b.raw.json --output sbom-b.cdx.json
      - name: Require byte-identical builds and canonical runtime SBOMs
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digests(directory: str) -> dict[str, str]:
              return {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path(directory).iterdir())
                  if path.is_file()
              }

          first = digests("dist-a")
          second = digests("dist-b")
          assert len(first) == 2, first
          assert first == second, (first, second)

          sbom_a = Path("sbom-a.cdx.json").read_bytes()
          sbom_b = Path("sbom-b.cdx.json").read_bytes()
          assert sbom_a == sbom_b
          payload = json.loads(sbom_a)
          assert payload["bomFormat"] == "CycloneDX"
          assert payload["specVersion"] == "1.5"
          assert "serialNumber" not in payload
          assert "timestamp" not in payload.get("metadata", {})
          components = payload.get("components", [])
          names = {
              component.get("name")
              for component in components
              if isinstance(component, dict)
          }
          root = payload.get("metadata", {}).get("component", {})
          assert root.get("name") == "e2h" or "e2h" in names
          assert not {"mypy", "pytest", "pytest-cov", "ruff"} & names
          PY
      - name: Seal and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(.venv/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PYTHONPATH=src .venv/bin/python -m e2h release seal dist-a \
            --output release-manifest.json \
            --project e2h \
            --version "$VERSION" \
            --toolchain-root source-a \
            --source-commit "$GITHUB_SHA" \
            --runner-generation ubuntu-24.04 \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          PYTHONPATH=src .venv/bin/python -m e2h release verify release-manifest.json dist-b --json \
            > release-verification.json
          PYTHONPATH=src .venv/bin/python -m e2h release verify-toolchain \
            release-manifest.json source-b \
            --expected-source-commit "$GITHUB_SHA" \
            --json > release-toolchain-verification.json
          PYTHONPATH=src .venv/bin/python -m e2h release inspect release-manifest.json --json > release-inspection.json
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path("release-inspection.json").read_text(encoding="utf-8"))[
              "metadata"
          ]["release_toolchain"]
          assert evidence["source_commit"] == os.environ["GITHUB_SHA"]
          assert evidence["runner_generation"] == "ubuntu-24.04"
          assert evidence["python_version"] == "3.13.14"
          assert evidence["uv_required_version"] == "0.12.2"
          assert evidence["build_backend"] == "hatchling.build"
          assert evidence["build_backend_version"] == "1.31.0"
          assert evidence["source_date_epoch"] == 1704067200
          assert len(evidence["source_tree_sha256"]) == 64

          verification = json.loads(
              Path("release-toolchain-verification.json").read_text(encoding="utf-8")
          )
          assert verification["verified"] is True
          assert verification["source_inputs_verified"] is True
          assert verification["source_tree_verified"] is True
          assert verification["source_commit_verified"] is True
          assert verification["evidence"] == evidence
          PY
      - name: Package deterministic source snapshot twice
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src .venv/bin/python -m e2h snapshot create \
            source-a source-a.e2hsnap
          PYTHONPATH=src .venv/bin/python -m e2h snapshot create \
            source-b source-b.e2hsnap
          cmp source-a.e2hsnap source-b.e2hsnap
          PYTHONPATH=src .venv/bin/python -m e2h snapshot verify source-a.e2hsnap
          PYTHONPATH=src .venv/bin/python -m e2h snapshot inspect \
            source-a.e2hsnap --json > release-source-inspection.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("release-inspection.json").read_text(encoding="utf-8"))
          source = json.loads(Path("release-source-inspection.json").read_text(encoding="utf-8"))
          source_tree = release["metadata"]["release_toolchain"]["source_tree_sha256"]
          assert source["snapshot_id"] == source_tree
          assert len(source["snapshot_id"]) == 64
          PY
          mv source-a.e2hsnap e2h-source.e2hsnap
          rm source-b.e2hsnap
      - name: Stage checksum-bound release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/dist
          cp dist-a/*.whl dist-a/*.tar.gz release/dist/
          cp sbom-a.cdx.json release/e2h-sbom.cdx.json
          cp e2h-source.e2hsnap release/
          cp release-manifest.json \
            release-verification.json \
            release-toolchain-verification.json \
            release-inspection.json \
            release-source-inspection.json \
            release/
          (
            cd release
            sha256sum dist/*.tar.gz dist/*.whl \
              e2h-sbom.cdx.json \
              e2h-source.e2hsnap \
              release-manifest.json \
              release-verification.json \
              release-toolchain-verification.json \
              release-inspection.json \
              release-source-inspection.json \
              > release-checksums.txt
          )
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: release/
          if-no-files-found: error
          retention-days: 7
