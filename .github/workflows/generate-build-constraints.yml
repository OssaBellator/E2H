name: Generate hashed build constraints

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/hash-build-dependencies'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/hash-build-dependencies
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Resolve and hash isolated build dependencies
        run: |
          set -euo pipefail
          printf 'hatchling==1.31.0\n' \
            | uv pip compile - \
                --python-version 3.13.14 \
                --generate-hashes \
                --no-header \
                --output-file build-constraints.txt
      - name: Commit generated constraints
        run: |
          set -euo pipefail
          if git diff --quiet -- build-constraints.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-constraints.txt
          git commit -m "Generate hashed build constraints"
          git push origin HEAD:agent/hash-build-dependencies
