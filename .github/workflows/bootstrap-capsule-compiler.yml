name: Bootstrap capsule compiler

on:
  push:
    branches: [agent/capsule-compiler]
    paths: [.bootstrap/ready]
  pull_request:
    branches: [agent/evidence-ingestion]
    paths:
      - .bootstrap/ready
      - .github/workflows/bootstrap-capsule-compiler.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/capsule-compiler
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Materialize compiler files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/e2h tests examples/compile
          cat .bootstrap/compiler.py.b64.* | base64 -d > src/e2h/compiler.py
          cat .bootstrap/compiler_cli.py.b64.* | base64 -d > src/e2h/compiler_cli.py
          cat .bootstrap/test_compiler.py.b64.* | base64 -d > tests/test_compiler.py
          cat .bootstrap/test_compiler_cli.py.b64.* | base64 -d > tests/test_compiler_cli.py
          cat .bootstrap/spec.yaml.b64.* | base64 -d > examples/compile/spec.yaml
          echo "74fc636bba9dd11deb77890b50661d464345229c65979846f34978e0986c7500  src/e2h/compiler.py" | sha256sum -c -
          echo "76985323f964b2c6d2745588c4c995fd12961090f6f34c60672438f7ee1d0d6c  src/e2h/compiler_cli.py" | sha256sum -c -
          echo "665784b2bfb64832e735cb65b766b5def643099da740a5ccb1d40d79f764d8fe  tests/test_compiler.py" | sha256sum -c -
          echo "12a0b130450f56e8dabd2d33b9bbba0c5dc41219005064e017f8d3a845eeca67  tests/test_compiler_cli.py" | sha256sum -c -
          echo "58ea5c989b8fcb64676957893cd98267ac507c257affbaa30cd4f13cd7fd4d42  examples/compile/spec.yaml" | sha256sum -c -
      - name: Update project integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/e2h/cli.py",
              "from e2h.experiment import resolve_under_root\n",
              "from e2h.compiler_cli import compiler_app\nfrom e2h.experiment import resolve_under_root\n",
          )
          replace_once(
              "src/e2h/cli.py",
              "app.add_typer(experiment_app, name=\"experiment\")\n",
              "app.add_typer(compiler_app, name=\"compile\")\napp.add_typer(experiment_app, name=\"experiment\")\n",
          )

          init_path = Path("src/e2h/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          compiler_import = '''from e2h.compiler import (\n    CapsuleProposal,\n    CompilerSpec,\n    VerificationReport,\n    compile_proposal,\n    materialize_capsule,\n    review_proposal,\n    verify_proposal,\n)\n'''
          anchor = "from e2h.experiment import ExperimentResult, ExperimentSpec, run_experiment\n"
          if init_text.count(anchor) != 1:
              raise SystemExit("src/e2h/__init__.py: import anchor mismatch")
          init_text = init_text.replace(anchor, compiler_import + anchor, 1)
          for name in (
              "CapsuleProposal",
              "CompilerSpec",
              "VerificationReport",
              "compile_proposal",
              "materialize_capsule",
              "review_proposal",
              "verify_proposal",
          ):
              marker = '    "ExperimentResult",\n'
              if marker not in init_text:
                  raise SystemExit("src/e2h/__init__.py: __all__ anchor mismatch")
              init_text = init_text.replace(marker, f'    "{name}",\n' + marker, 1)
          if '__version__ = "0.3.0"' not in init_text:
              raise SystemExit("src/e2h/__init__.py: version anchor mismatch")
          init_text = init_text.replace('__version__ = "0.3.0"', '__version__ = "0.4.0"', 1)
          init_path.write_text(init_text, encoding="utf-8")

          replace_once("pyproject.toml", 'version = "0.3.0"', 'version = "0.4.0"')

          ci_anchor = '''      - run: >-\n          uv run e2h ingest otlp examples/ingest/otlp.json\n'''
          ci_steps = '''      - run: >-\n          uv run e2h compile proposal\n          .e2h/transcript-bundle.json\n          examples/compile/spec.yaml\n          --output .e2h/compiler-proposal.json\n      - run: >-\n          uv run e2h compile verify\n          .e2h/compiler-proposal.json\n          --workspace .\n          --output .e2h/compiler-verification.json\n          --require-strong\n      - run: >-\n          uv run e2h compile review\n          .e2h/compiler-proposal.json\n          --reviewer ci\n          --decision approve\n          --output .e2h/compiler-approved.json\n      - run: >-\n          uv run e2h compile materialize\n          .e2h/compiler-approved.json\n          .e2h/compiler-verification.json\n          --output .e2h/compiled-capsule.yaml\n      - run: >-\n          uv run e2h run\n          .e2h/compiled-capsule.yaml\n          --workspace .\n          --output .e2h/compiled-run.json\n'''
          replace_once(".github/workflows/ci.yml", ci_anchor, ci_steps + ci_anchor)
          artifact_anchor = "            .e2h/otlp.jsonl\n"
          artifact_paths = '''            .e2h/otlp.jsonl\n            .e2h/compiler-proposal.json\n            .e2h/compiler-verification.json\n            .e2h/compiler-approved.json\n            .e2h/compiled-capsule.yaml\n            .e2h/compiled-run.json\n'''
          replace_once(".github/workflows/ci.yml", artifact_anchor, artifact_paths)

          replace_once(
              "README.md",
              "The repository now contains three connected vertical slices: deterministic **task capsule replay**, an observable **trace + replay-matrix layer**, and a privacy-aware **evidence ingestion layer**.",
              "The repository now contains four connected vertical slices: deterministic **task capsule replay**, an observable **trace + replay-matrix layer**, a privacy-aware **evidence ingestion layer**, and a review-gated **capsule compiler**.",
          )
          replace_once(
              "README.md",
              "- Content-addressed source provenance without exposing local filesystem paths.\n",
              "- Content-addressed source provenance without exposing local filesystem paths.\n"
              "- Immutable capsule proposals with evidence references and stable proposal IDs.\n"
              "- Controlled mutation verification plus human approval/rejection gates.\n"
              "- Capsule materialization only after matching review and verification evidence.\n",
          )
          quick_anchor = '''uv run e2h ingest otlp examples/ingest/otlp.json \\\n  --output .e2h/otlp-bundle.json \\\n  --traces .e2h/otlp.jsonl\n'''
          quick_steps = '''uv run e2h compile proposal .e2h/transcript-bundle.json examples/compile/spec.yaml \\\n  --output .e2h/compiler-proposal.json\nuv run e2h compile verify .e2h/compiler-proposal.json \\\n  --workspace . --output .e2h/compiler-verification.json --require-strong\nuv run e2h compile review .e2h/compiler-proposal.json \\\n  --reviewer maintainer --decision approve --output .e2h/compiler-approved.json\nuv run e2h compile materialize .e2h/compiler-approved.json \\\n  .e2h/compiler-verification.json --output .e2h/compiled-capsule.yaml\n'''
          replace_once("README.md", quick_anchor, quick_anchor + quick_steps)
          compiler_section = '''## Capsule compilation\n\nThe compiler turns a sanitized ingestion bundle plus a human-authored compiler specification into an immutable proposal. Evidence may supply the goal and provenance, but executable checks and mutation probes remain explicit trusted declarations; imported text is never silently promoted into a command.\n\nEach proposal ID is the SHA-256 digest of its immutable core. Verification binds to that exact capsule and ordered mutation plan. A strong report requires the baseline capsule to pass and every declared controlled environment mutation to make the oracle fail. Human reviews are append-only, and the latest approval or rejection determines whether materialization is allowed.\n\n`e2h compile materialize` rejects stale or mismatched reports, weak verification, and unapproved proposals by default. Mutation verification executes the proposed commands, so it has the same security boundary as ordinary task capsule replay and should run in an external sandbox for untrusted workloads.\n\n'''
          replace_once("README.md", "## Architecture direction\n", compiler_section + "## Architecture direction\n")

          roadmap_old = '''- [ ] Environment and artifact snapshots.\n- [ ] Oracle proposal, mutation testing, and human review.\n'''
          roadmap_new = '''- [ ] Environment and artifact snapshots.\n- [x] Review-gated capsule proposals with immutable evidence provenance.\n- [x] Controlled environment mutation verification.\n- [x] Human approval/rejection and gated capsule materialization.\n- [ ] Richer file, JSON, and artifact oracle templates and mutation operators.\n'''
          replace_once("ROADMAP.md", roadmap_old, roadmap_new)
          PY
      - name: Format and validate
        run: |
          uv sync --extra dev
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run e2h ingest transcript examples/ingest/transcript.json --output .e2h/transcript-bundle.json
          uv run e2h compile proposal .e2h/transcript-bundle.json examples/compile/spec.yaml --output .e2h/compiler-proposal.json
          uv run e2h compile verify .e2h/compiler-proposal.json --workspace . --output .e2h/compiler-verification.json --require-strong
          uv run e2h compile review .e2h/compiler-proposal.json --reviewer bootstrap --decision approve --output .e2h/compiler-approved.json
          uv run e2h compile materialize .e2h/compiler-approved.json .e2h/compiler-verification.json --output .e2h/compiled-capsule.yaml
          uv run e2h run .e2h/compiled-capsule.yaml --workspace . --output .e2h/compiled-run.json
      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .bootstrap
          git rm .github/workflows/bootstrap-capsule-compiler.yml
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add review-gated capsule compiler"
          git push origin HEAD:agent/capsule-compiler
