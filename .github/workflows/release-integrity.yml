name: Release integrity CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproducible-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
      UV_PREVIEW_FEATURES: "sbom-export"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - name: Prepare independent clean source copies
        run: |
          mkdir source-a source-b
          git archive HEAD | tar -x -C source-a
          git archive HEAD | tar -x -C source-b
      - name: Build release artifacts twice
        run: |
          (cd source-a && uv build --build-constraint build-constraints.txt --out-dir ../dist-a)
          (cd source-b && uv build --build-constraint build-constraints.txt --out-dir ../dist-b)
          rm -f dist-a/.gitignore dist-b/.gitignore
      - name: Export and canonicalize runtime SBOM twice
        run: |
          (cd source-a && uv export --locked --format cyclonedx1.5 --output-file ../sbom-a.raw.json)
          (cd source-b && uv export --locked --format cyclonedx1.5 --output-file ../sbom-b.raw.json)
          uv run e2h release canonicalize-sbom sbom-a.raw.json --output sbom-a.cdx.json
          uv run e2h release canonicalize-sbom sbom-b.raw.json --output sbom-b.cdx.json
      - name: Require byte-identical builds and canonical runtime SBOMs
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digests(directory: str) -> dict[str, str]:
              return {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path(directory).iterdir())
                  if path.is_file()
              }

          first = digests("dist-a")
          second = digests("dist-b")
          assert len(first) == 2, first
          assert first == second, (first, second)

          sbom_a = Path("sbom-a.cdx.json").read_bytes()
          sbom_b = Path("sbom-b.cdx.json").read_bytes()
          assert sbom_a == sbom_b
          payload = json.loads(sbom_a)
          assert payload["bomFormat"] == "CycloneDX"
          assert payload["specVersion"] == "1.5"
          assert "serialNumber" not in payload
          assert "timestamp" not in payload.get("metadata", {})
          components = payload.get("components", [])
          names = {
              component.get("name")
              for component in components
              if isinstance(component, dict)
          }
          root = payload.get("metadata", {}).get("component", {})
          assert root.get("name") == "e2h" or "e2h" in names
          assert not {"mypy", "pytest", "pytest-cov", "ruff"} & names
          PY
      - name: Seal first build and verify second build
        run: |
          VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv run e2h release seal dist-a \
            --output release-manifest.json \
            --project e2h \
            --version "$VERSION"
          uv run e2h release verify release-manifest.json dist-b --json \
            > release-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integrity
          path: |
            dist-a/*
            release-manifest.json
            release-verification.json
            sbom-a.cdx.json
