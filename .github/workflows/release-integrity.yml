name: Release integrity CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproducible-build:
    name: Build verified release
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      artifact-name: release-integrity
      validate-release-tag: false
