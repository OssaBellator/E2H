name: Refresh immutable release branch

on:
  push:
    branches: [agent/immutable-release-sbom]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/immutable-release-sbom
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run ruff format tests/test_publish_workflow.py
      - run: uv lock
      - name: Commit deterministic maintenance changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_publish_workflow.py uv.lock
          git commit -m "Refresh immutable release formatting and lockfile"
          git push origin HEAD:agent/immutable-release-sbom
