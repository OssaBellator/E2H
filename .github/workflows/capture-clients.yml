name: Capture clients CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 security fix
        with:
          node-version: "22"
      - run: node --test clients/browser/capture.test.mjs clients/vscode/capture.test.mjs
