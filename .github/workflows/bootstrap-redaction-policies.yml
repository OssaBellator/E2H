name: Bootstrap redaction policies

on:
  push:
    branches: [agent/redaction-policies]
    paths: [.bootstrap/redaction-policies-ready]
  pull_request:
    branches: [main]
    paths:
      - .bootstrap/redaction-policies-ready
      - .github/workflows/bootstrap-redaction-policies.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/redaction-policies
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply fail-closed integration patch
        run: |
          python bootstrap_redaction_policies.py
          python fix_redaction_cli_lines.py
          python prepare_redaction_behavior.py
          python fix_redaction_behavior.py
          python fix_placeholder_scan.py
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint and format
        run: |
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
      - name: Strict typing
        run: uv run mypy src
      - name: Test suite
        run: uv run pytest
      - name: Validate policy and review smoke
        run: |
          mkdir -p .e2h
          uv run e2h ingest transcript examples/ingest/transcript.json \
            --redaction-policy examples/ingest/redaction-policy.yaml \
            --redaction-report .e2h/redaction-review.json \
            --output .e2h/redaction-bundle.json \
            --traces .e2h/redaction-trace.jsonl
          uv run python - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(Path(".e2h/redaction-bundle.json").read_text(encoding="utf-8"))
          review = json.loads(Path(".e2h/redaction-review.json").read_text(encoding="utf-8"))
          rendered = json.dumps(bundle)
          assert bundle["provenance"]["redaction_policy_id"] == "support-review"
          assert bundle["provenance"]["redaction_policy_sha256"] == review["policy_sha256"]
          assert bundle["redaction_review"] == review
          assert review["redaction_enabled"] is True
          assert review["counts_by_kind"] == {"email": 1, "secret": 1}
          assert review["residual_findings"] == []
          assert review["allow_value_count"] == 1
          assert "alex@example.com" not in rendered
          assert "sk-example1234567890" not in rendered
          assert "alex@example.com" not in json.dumps(review)
          assert "support@example.com" not in json.dumps(review)
          assert len(Path(".e2h/redaction-trace.jsonl").read_text().splitlines()) == 5
          PY
      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .bootstrap/redaction-policies-ready
          rm -rf .e2h
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add configurable redaction policies"
          git push origin HEAD:agent/redaction-policies
