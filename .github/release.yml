changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security and release integrity
      labels:
        - security
        - supply-chain
    - title: Features and improvements
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - bugfix
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
